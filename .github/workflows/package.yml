# About: CI/CD for Kickoff Nested. Every push and pull request builds the
# pacman package with makepkg in an Arch Linux container (which runs all
# tests in check()) and keeps it as a workflow artifact. Pushing the release
# tag vVERSION (e.g. v1.0.0 for VERSION 1.0.0) also publishes a GitHub
# Release with the package attached. Other v* tags, such as the KDE release
# tags in this repository's history, never create a release.
#
# SPDX-FileCopyrightText: 2026 Ueda-Ichitaka
# SPDX-License-Identifier: MIT

name: Package

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
    steps:
      - name: Install build and runtime dependencies
        run: >
          pacman -Syu --noconfirm --needed
          git github-cli cmake extra-cmake-modules ninja
          libplasma plasma-workspace plasma5support kcmutils kconfig kcoreaddons
          kiconthemes kirigami kirigami-addons kitemmodels ksvg qt6-declarative

      # Full history: pkgver.sh counts commits and looks for the release tag
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build and test the package
        run: |
          useradd --create-home builder
          chown -R builder: "$GITHUB_WORKSPACE"
          su builder -c "git config --global --add safe.directory '$GITHUB_WORKSPACE' \
            && cd '$GITHUB_WORKSPACE/packaging' && makepkg --noconfirm"

      - uses: actions/upload-artifact@v7
        with:
          name: kickoff-nested-package
          path: packaging/*.pkg.tar.zst
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(cat VERSION)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME is not the release tag v$version from VERSION; no release."
            exit 0
          fi
          notes="Kickoff Nested $version

          Based on KDE plasma-desktop $(cat UPSTREAM_BASE), built against $(pacman -Q plasma-workspace libplasma | tr '\n' ' ').
          Install: sudo pacman -U kickoff-nested-*.pkg.tar.zst"
          gh release create "$GITHUB_REF_NAME" packaging/*.pkg.tar.zst \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kickoff Nested $version" \
            --notes "$notes"
